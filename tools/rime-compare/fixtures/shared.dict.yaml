# RIME × Stele 对照实验的**共用词表**
#
# 这份词表是这次对照的关键：两边（librime 与 stele）读**同一份文件**，
# 于是"候选排序不同"再也无法用"词库不同"来解释——它只能来自引擎。
#
# 编码用空格分隔的编码单元（RIME 的写法：`ni hao`），权重在第三列。
# 每一条都带一个**互不相同的权重**，这样"两边是否都按权重排序"
# 是一句可以被证伪的话（见 `compare.py` 的 `weight-order` 断言）。
#
# 这份数据是**自造的**，不是任何真实输入法的词库——对照要找的是
# 机制差异，不是比谁的数据更全。
---
name: stele-cmp
version: "1.0"
sort: by_weight
...

# 单一编码单元：三个同码字，权重 900 / 500 / 100
你	ni	900
尼	ni	500
泥	ni	100

# 同码词：权重 800 / 20 / 10
你好	ni hao	800
拟好	ni hao	20
尼号	ni hao	10

好	hao	900
号	hao	300
耗	hao	100

# 跨切分竞争：`xian` 既是单音节 `xian`（先），也是 `xi an`（西安）
我	wo	900
门	men	500
我们	wo men	1000
先	xian	900
西安	xi an	850
