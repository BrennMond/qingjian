# 对照实验的 **Stele 侧**方案
#
# 与 `fixtures/rime/stele-cmp.schema.yaml` 是**同一份词表、同一批零件**
# 的两种写法：那边是 RIME 的原生写法（`engine.translators` 列零件名），
# 这边是 Stele 的写法（`engine.translator: spelling_graph` + 显式的编码字母表）。
#
# 两处**必须保持等价**，否则对照比的就不是引擎而是配置：
#   · 同一个词库（`stele-cmp`，由 `compare.py` 从 `shared.dict.yaml` 复制）
#   · 同一个缩写规则（每个音节取首字母）
#   · 都不挂语言模型 / 转换表 / 反查
#
# 三个开关是**必须声明**的：`punct_segmentor` 与 `punctuator` 会读
# `full_shape` / `ascii_punct`，而 Stele 不会静默创建未声明的开关
# （`Options::set` 返回 false，功能会永远关着）——装载期直接报错。
schema:
  schema_id: stele-cmp
  name: RIME × Stele Shared Wordlist
  version: "1.0"

switches:
  - name: ascii_mode
    states: [中, Ａ]
    reset: 0
  - name: full_shape
    states: [半角, 全角]
    reset: 0
  - name: ascii_punct
    states: [¥, $]
    reset: 0

engine:
  tag: abc
  translator: spelling_graph
  candidate_cap: 200
  processors: [ascii_composer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
  filters: [uniquifier]

speller:
  delimiter: "'"
  # Stele 的字母表是**编码单元集**（拼音方案写音节表）。
  # 词库里的编码用空格分隔，每一段都必须是这里的一项。
  alphabet: [ni, hao, wo, men, xian, xi, an]
  rules:
    - abbrev: { take: 1, weight: 0.5 }

translator:
  dictionary: stele-cmp
