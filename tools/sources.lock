# Qingjian IME 部署源数据锁文件 —— **已跟踪的可复现输入**（阶段 4 / 审计 J2.2）
#
# 这个文件**进仓库**，取回的数据**不进**（落在 `schemes/qingjian-default/build/`，
# 被 `.gitignore` 排除）。它替换了旧方案里"只存在于 build/ 的
# sources.lock"——那份文件是**输出**，克隆仓库的人看不到；
# 这一份是**输入**，`tools/fetch-sources.sh` 以它为唯一权威清单。
#
# ── 格式 ────────────────────────────────────────────────────────────────
#
# 每行一条记录，字段用 `|` 分隔（上游 URL 中不含 `|`）。`#` 起是注释，
# 空行忽略。
#
#   字段 1  目标路径（相对 `schemes/qingjian-default/build/`）
#   字段 2  下载 URL。**必须固定到 commit SHA 或 release asset**，
#           不得出现 `main` / `master` / `latest` 这类浮动引用。
#   字段 3  revision：commit SHA（release asset 时写 tag 名）
#   字段 4  SPDX 许可标识（照上游 LICENSE 原文，不推断）
#   字段 5  版权行（照上游 LICENSE / 文件头原文；上游没写就写「未署名」）
#   字段 6  sha256（小写十六进制）。`TODO-UNVERIFIED` = 尚未核对，
#           `fetch-sources.sh` 会下载、报告实测哈希，但**不会**把它写回这里，
#           并且默认以非零退出提示"清单未核对完"。
#   字段 7  说明（含取这份数据做什么）
#
# ── sha256 是怎么来的（不是猜的） ──────────────────────────────────────
#
# 本文件的全部 sha256 于 2026-09-13 按**字段 2 的 URL** 下载后实测；
# 同时与仓库里已有的 `schemes/qingjian-default/build/` 副本核对，
# 16 份**全部逐字节一致**。也就是说：这些哈希对应的正是字段 3 的 revision。
# 复现命令见 `THIRD_PARTY_NOTICES.md` §6。
#
# 上游改了数据（同一个 URL 内容变化）时，`fetch-sources.sh` 会报错停下，
# 而不是静默采用——词库内容变了，权重、音节表与候选排序都会跟着变。
#
# ── 许可边界 ────────────────────────────────────────────────────────────
#
# 这些文件**由使用者在自己机器上取回**，用于本地编译，不随本仓库分发。
# 其中 emoji/* 属于 rime-ice（**GPL-3.0-only**）：本项目**不分发**它们，
# 也不把它们编译进任何已跟踪的产物；若使用者再分发自己 build/ 下的副本，
# 需要自行满足 GPL-3.0 的义务。完整清单与许可证文本见
# `THIRD_PARTY_NOTICES.md` 与 `licenses/`。
#
