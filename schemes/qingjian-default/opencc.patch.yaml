# Optional overlay: OpenCC-powered conversions (emoji / traditional Chinese)
#
# 可选叠加层：OpenCC 驱动的转换（emoji / 简繁）。
#
# # 怎么用
#
# 1. 取回数据（一次）：
#      bash tools/fetch-sources.sh
# 2. 把它**拷成方案的补丁层**（装载器按 RIME 的约定自动应用
#    `<schema_id>.custom.yaml`；本文件**故意不叫那个名字**，见下面的说明）：
#      cp schemes/qingjian-default/opencc.patch.yaml \
#         schemes/qingjian-default/pinyin.custom.yaml
# 3. 然后开关就生效了：
#      qingjian --scheme-dir schemes/qingjian-default --option=emoji weixiao
#      qingjian --scheme-dir schemes/qingjian-default --option=traditionalization zhongguo
#
# # 为什么是"叠加层"而不是默认装配
#
# **默认方案必须能在零外部数据的情况下工作**——克隆仓库、`cargo run`
# 就能打字。数据在 `build/` 下、由使用者自己取回（PLAN §10）。
# 若默认装配里挂着 `simplifier@emoji`，数据缺失时**整个方案编译失败**
# （实测：`qingjian nihao` 直接报「零件需要外部数据」）——那就把
# "开箱可用"换成"必须先下载 4 MB 数据"，正是我们要避免的。
#
# 于是分工是：
#   · `pinyin.schema.yaml`  —— 零外部依赖，开箱可用
#   · 本文件              —— 有数据时追加两个转换滤镜
#
# **本文件故意不叫 `pinyin.custom.yaml`**：那个名字会被装载器**自动**
# 应用，于是"克隆仓库后跑不起来"又回来了。改名之后，应用它是一个
# **显式动作**（`cp` 一下），失败模式从"开箱就坏"变成"我还没启用它"。
#
# 两个开关（`emoji` / `traditionalization`）**留在基础方案里**：
# 它们只是"有名字的布尔量"（D20），声明开关不依赖任何数据。
# 所以关掉这两个转换时，本文件只是让开关失效——不会报错。
#
# # 数据从哪来
#
# 见同级目录的 `opencc.manifest.yaml`：转换数据按**别名**声明路径，
# 本文件只写别名与开关。这样"数据缺了"与"配置写错了"是两件可分别检查的事。

engine:
  filters:
    # 顺序即语义：先出 emoji / 繁体候选，最后去重。
    - uniquifier
    - simplifier@emoji
    - simplifier@traditionalize

emoji:
  option_name: emoji
  # 转换候选的权重比。**这个值决定用户看不看得见 emoji**：
  # 候选按权重降序排，而每页只有 9 个——0.95 会让 emoji 掉出可见范围
  # （实测：表装进来了、候选也生成了，就是排在 70 名开外）。
  # 0.5 让它在常用词的同一页里露面，同时仍然排在原词之后。
  weight: 0.5
  # 备注保留原候选的（`inherit_comment` 默认就是 true）。
  # **不要设成 false**：`uniquifier` 按文本去重，而转换候选与原文
  # 常常只有备注不同；清掉备注会让它们变成"完全相同的候选"而被合并，
  # 结果是"功能静默失效"。

traditionalize:
  option_name: traditionalization
  # 简繁转换**紧跟原文**就够了（它只需要排在原文后面，不必抢到前面）。
  weight: 0.9
