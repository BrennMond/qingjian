# 青简・字形码（演示方案）
#
# **这个方案存在的意义是当反例。**
#
# 它是一个"精确编码"类输入法：编码单元是**单个字母**，编码集合**不可枚举**
# （字根的组合是幂集），因此构造不出"拼写 → 编码"的映射，也就不需要
# 拼写规则、不需要切分图。它只需要"编码 → 字"的查表。
#
# 如果哪天有人把引擎写回"拼音专用"（强迫所有方案都走拼写图），
# 这份方案会先跑不起来——于是 D20 的通用性从 P1 起就被测试保护（D33）。
#
# 编码是**编造的**，故意不像任何真实输入法，
# 以免给人"引擎里内置了某种字形方案"的错觉。

schema:
  schema_id: shape
  name: 青简・字形码（演示）
  version: "0.1.0"

switches:
  - name: ascii_mode
    states: [中, Ａ]
    reset: 0

engine:
  tag: code
  # 关键区别：精确编码族。不需要拼写规则，也不需要切分图。
  translator: exact_code
  candidate_cap: 200

speller:
  # 编码单元就是单个字母 —— "编码集合不可枚举"那类输入法的形式特征。
  alphabet: [a, b, c, d, e, f, g, h]

translator:
  dictionary: shape
