# 青简・拼音 —— 主词典（**导入清单**）
#
# 这个文件只做导入，让"手写词库"与"生成词库"分开，各自的来源一眼可见，
# 也演示 `import_tables` 的合并与优先级（**先出现者优先**）。
#
# 真正的默认词库是 `cn_dicts/generated.dict.yaml`：
# 由 `tools/wordlist-gen` 从 MIT / Apache-2.0 的公开数据生成，
# 详见 `tools/README.md`。**不要手改它**——重新生成即可。

---
name: pinyin
version: "0.2.0"
sort: by_weight
import_tables:
  # **词级读音人工覆盖表**（审计 §2.I）——必须排在 generated **之前**：
  # 生成器只会按**单字首选读音**拼词编码（词级读音不在任何一份可分发数据里），
  # 拼错的那些要靠这张表补上正确读音。
  # 见 `cn_dicts/word_pinyin.override.dict.yaml` 的文件头。
  - cn_dicts/word_pinyin.override
  # 手写的演示词库（P1 起就在，用来验证装载路径）。
  # 它**先导入**，因此同码时它的权重生效——这正好演示「先出现者优先」。
  - cn_dicts/base
  # 生成的默认词库（41 万条）。
  - cn_dicts/generated
...

# 主词典自己的词条（在所有导入的**之前**，因此同码时它优先）。
你	ni	20000
我	wo	18000
