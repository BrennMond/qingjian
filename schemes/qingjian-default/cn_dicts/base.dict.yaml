# 青简・拼音 —— 基础词库
#
# 格式： `词 <TAB> 编码 <TAB> 权重`
#   · 编码是空格分隔的编码单元序列，**单元必须出现在方案的 alphabet 里**，
#     否则装载期会响亮报错（而不是让那个词永远查不到）。
