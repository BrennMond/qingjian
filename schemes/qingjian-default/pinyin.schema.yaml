  # 拼写规则。**规范拼写永远是基线**，规则只在其上派生更多有效拼写。
  #
  # 下面这条就是"简拼"：每个音节取首字母，于是 `nh` 也能命中 `ni hao`。
  # 引擎不知道它叫简拼，只知道这些边带 ABBREV 属性、代价是 ln(0.5)。
  rules:
    # **缩写（简拼）**：每个音节取其首字母。
    #
    # ⚠️ 我们的机制里它只对**单音节**成立（`n` → `ni`、`h` → `hao`），
    # 而像「你好」（`ni hao`）这种**两个音节都要缩**的写法需要输入
    # `nhao`（第一音节缩、第二音节保留）。
    #
    # 为什么不是"两条规则串起来就能支持 `nh`"：缩写边是**方案的拼写代数**，
    # 而词库里的编码是**固定的规范编码**（`ni hao`）。`nh` 要命中它，
    # 展开里必须出现 `[ni][hao]` 这条**完整**切分——而把 `ni`、`hao`
    # 都缩成单字母之后，那条切分的代价已经**高于**几十条同样合法的
    # `[n][h…]` 切分，早被 `max_expansions` 截断掉了。
    # RIME 那边靠运行期按拼写属性重写输入（我们有意不做，见 D14/D20），
    # 所以这里如实记下边界，而不是留一条"看起来支持"的规则。
    - abbrev: { take: 1, weight: 0.5 }

translator:
  dictionary: pinyin
