# 石经・拼音 —— **词级读音人工覆盖表**
#
# 为什么需要它（独立审计 §2.I）
# ------------------------------------------------------------------
# 默认词库的编码是 `tools/wordlist-gen` 从**单字**读音（pinyin-data 的
# `pinyin.txt`）按"首读音 + 有限启发式"拼出来的，因此**没有词级读音**。
# 审计核对出的四个例子：
#
#   词      生成器给的（错）   常见正确读音
#   银行    yin xing           yin hang
#   重庆    zhong qing         chong qing
#   音乐    yin le             yin yue
#   重新    zhong xin          chong xin
#
# 于是 `yinhang` / `chongqing` 召回不到目标词，而**错误读音反而会召回**。
# 更糟的是：词没有正确编码时，排序、个人记忆、向量**都修不了它**——
# 它们只能调整"已经存在的编码"的次序。
#
# 这张表做什么
# ------------------------------------------------------------------
# 为常见多音字词补上**正确读音**，并且**允许一个词有多个读音**
# （审计 §2.I 第 5 条：不能在数据生成期永久只选一个读音）。
# 生成器给的编码**仍然保留**——多音字本来就有两读，`yinxing` 也确实是
# 一个合法的读音组合，删掉它反而是另一种错误。
#
# 装载优先级
# ------------------------------------------------------------------
# `pinyin.dict.yaml` 把这张表**先于** `cn_dicts/generated` 导入，
# 因此同码时它的权重生效（"先出现者优先"）。
#
# 来源与审计
# ------------------------------------------------------------------
# **本表是自撰的**（第一方数据），不是从任何第三方词表复制。
# 每一条的判断依据是《现代汉语词典》口径的常用读音；收录范围刻意保守：
#   1. 审计点名的四个词；
#   2. 高频多音字词、常见地名与姓氏（这些是错读音影响最大的类别）。
# 新增条目请连同"为什么是这个词"一起写进本文件，并跑
# `cargo test -p stele-schemes --test word_pinyin_quality`。
#
# 分发：本表随仓库分发，许可与其余手写方案数据一致（MIT OR Apache-2.0）。

---
name: word_pinyin_override
version: "0.1.0"
sort: by_weight
...

# ── 审计点名的四例 ──────────────────────────────────────────────
银行	yin hang	18000
重庆	chong qing	16000
音乐	yin yue	15000
重新	chong xin	14000

# ── 常用词（质量评测集里召回失败/首选的） ──────────────────────
# `weixin` 在生成词库的编码下排不到第一（会被「卫星」「威信」压过），
# 而「微信」是最高频的那个意思。这类"同音词里谁是常用义"的判断
# **只能来自人工**——生成器没有语料可以定这个。
微信	wei xin	20000

# ── 生成器的**单字编码错误**（本轮实测发现） ────────────────────
# 生成器给「家」编的码是 `jie`（权重 41023），而「家」读 `jia`。
# 后果是连锁的：`jie` 的首选变成「家」，`nihaoshijie` 被拼成
# 「你好**是家**」而不是「你好**世界**」。
#
# 这里补上正确读音；**错误的那条仍在生成词库里**（见文件末尾的说明与
# `word_pinyin_quality.rs` 里那条 #[ignore] 的根因记录）——
# 根本修法是改 `tools/wordlist-gen` 并重新生成，不是靠覆盖表长期掩盖。
家	jia	41023

