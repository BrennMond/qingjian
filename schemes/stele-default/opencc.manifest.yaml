# 石经・拼音 —— OpenCC 转换数据清单（**小元数据，随仓库分发**）
#
# 为什么要有这份清单，而不是让装载器去猜文件名：
#
#   转换用的**数据本身不随仓库分发**（授权与体积，见 PLAN §10）——
#   它们由 `tools/fetch-sources.sh` 取到 `build/` 下，而 `build/` 是
#   `.gitignore` 的。因此"这份方案到底依赖哪些 OpenCC 文件"必须是一条
#   **显式声明**，否则：
#
#   · 用户克隆仓库后只看到 `opencc_config: opencc/s2t.json`，
#     不知道要去哪取那个文件、也不知道它属于哪个上游；
#   · `stele --components` 只能靠"文件在不在"来猜数据齐不齐，
#     而"文件在不在"不是"这份方案要什么"。
#
# 于是：**清单是声明，文件是数据**。清单进仓库（小、是人写的），数据不进。
#
# 字段：
#   name    —— `simplifier@<name>` 的别名（方案 `engine.filters` 里用）
#   config  —— 相对本目录的 OpenCC 配置路径
#   source  —— 从哪取（人话，指向上游）
#   license —— 上游许可
#   fetch   —— 取回它的命令（`fetch-sources.sh` 已经包含这些条目）
converters:
  - name: emoji
    config: build/emoji/emoji.json
    source: rime-ice 的 opencc/emoji.json + emoji.txt + others.txt
    license: Apache-2.0
    purpose: 把「微笑」这类词转成 emoji 候选（开关 emoji）

  - name: traditionalize
    config: build/opencc/s2t.json
    source: OpenCC 的 STCharacters.txt + STPhrases.txt（自建于 build/opencc）
    license: Apache-2.0
    purpose: 开启 traditionalization 时给出繁体候选
