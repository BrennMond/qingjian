[package]
name = "stele-memory"
description = "Stele-IME 的用户记忆：频率 + 时间衰减，自写紧凑 KV（零第三方依赖）。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# 服务提供者（PLAN §2.1 的"侧挂服务"）：只依赖内核的服务定义。
# 它是**周边 crate**，按 D9 本可以用受审依赖——但我们选了自写格式（B1），
# 于是它和内核一样是零依赖的。见 `docs/HANDOFF.md` §7.6.1 ④。
[dependencies]
stele-core = { path = "../stele-core" }

[dev-dependencies]
stele-engine = { path = "../stele-engine" }
stele-schemes = { path = "../stele-schemes" }

[lints]
workspace = true
