[package]
name = "stele-schemes-builtin"
description = "随引擎提供的最小方案（方案资产，不是内核的一部分）。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# 这是**方案资产**：它当然含有输入法专属的词汇（拼音、音节…），
# 那正是它存在的意义。门禁 `verify-no-ime-vocab` 只约束内核
# （stele-core / stele-engine），**刻意不约束本 crate**——见 PLAN D24。
[dependencies]
stele-core = { path = "../stele-core" }
stele-engine = { path = "../stele-engine" }

[lints]
workspace = true
