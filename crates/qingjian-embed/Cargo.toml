[package]
name = "qingjian-embed"
description = "Qingjian IME 的本地向量偏好记忆：从用户自己的历史里学出定点向量，作为 Ranker 重排（零依赖、不上网、无外部模型）。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# 服务提供者（PLAN §2.1 的"侧挂服务"）：只依赖内核的服务定义。
# 它是**周边 crate**，按 D9 本可以用受审依赖——但我们选了自写整数投影（零依赖），
# 于是它和内核一样干净。见 `docs/embed-design.md`。
[dependencies]
qingjian-core = { path = "../qingjian-core" }

[dev-dependencies]
qingjian-engine = { path = "../qingjian-engine" }
qingjian-schemes = { path = "../qingjian-schemes" }
qingjian-memory = { path = "../qingjian-memory" }

[lints]
workspace = true
