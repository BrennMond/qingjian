# 内联零件测试词库
#
# 每个编码都刻意编造，只服务于一条断言：
#   · `a b` 下六个长短不一的词 → 测长词优先
#   · `H e l l o` → 小写候选，用来测自动大写
---
name: inline
version: "0.1.0"
sort: by_weight
...

# 长词优先：**权重顺序与"长词优先"的顺序刻意不同**——
# 长词给低权重，于是"按分数排"会把它压到最后，而"长词优先"
# 应当把它提到第 4、5 位。两种顺序一致的话，这条测试什么也证明不了。
十	a b	1000
乙	a b	950
丙	a b	900
丁	a b	850
甲乙	a b	800
十字架	a b	750

# 自动大写：候选是小写，而编码是大写开头
hello	H e l l o	1000

# 置顶候选：两组独立的编码，**刻意与 `a b` 分开**——
# 同一个编码上的两条置顶规则是"后写的赢"（上游语义），
# 混在一起就没法分别验收两种写法了。
甲	m n	1000
乙	m n	900
丙	m n	800
戊	p q	1000
己	p q	900
庚	p q	800
