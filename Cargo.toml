# Qingjian IME / 青简输入法 — workspace root
#
# 见 PLAN.md（项目章程）与 docs/engine-design.md（引擎设计权威定义）。
# 铁律：`qingjian-core` / `qingjian-engine` 零第三方依赖（PLAN §1 D9）。

[workspace]
resolver = "2"
members = [
    "crates/qingjian-core",
    "crates/qingjian-engine",
    "crates/qingjian-config",
    "crates/qingjian-dict",
    "crates/qingjian-table",
    "crates/qingjian-memory",
    "crates/qingjian-embed",
    "crates/qingjian-schemes",
    "crates/qingjian-cli",
    "crates/qingjian-bench",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
# 由 rust-toolchain.toml 固定为 1.98；MSRV 取一个我们真正验证过的下限。
#
# 为什么从 1.82 提到 1.89：用户记忆的落盘要用**跨进程文件锁**
# （`std::fs::File::lock` / `unlock`），而它是 1.89 稳定的。
# 备选是引入一个锁 crate，或自己写一套"锁目录 + 陈旧锁清理"——
# 前者违反"核心零第三方依赖"，后者是一段很容易写错的并发代码。
# 用 std 的现成实现、把 MSRV 提上去，是这里代价最小的一步。
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/qingjian-ime"
authors = ["Qingjian contributors"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# 少数 pedantic 项是纯风格，且"改"只会让代码更难读。**逐条列出**，
# 而不是关掉整个 pedantic——关掉整组等于放弃了那几百条有用的检查。
too_many_lines = "allow"          # CLI 的参数分派与自检函数，拆开反而更难跟


[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
