# Stele-IME / 石經 — workspace root
#
# 见 PLAN.md（项目章程）与 docs/engine-design.md（引擎设计权威定义）。
# 铁律：`stele-core` / `stele-engine` 零第三方依赖（PLAN §1 D9）。

[workspace]
resolver = "2"
members = [
    "crates/stele-core",
    "crates/stele-cli",
    "crates/stele-bench",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/stele-ime"
authors = ["Stele-IME contributors"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
