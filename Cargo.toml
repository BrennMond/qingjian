# Stele-IME / 石經 — workspace root
#
# 见 PLAN.md（项目章程）与 docs/engine-design.md（引擎设计权威定义）。
# 铁律：`stele-core` / `stele-engine` 零第三方依赖（PLAN §1 D9）。

[workspace]
resolver = "2"
members = [
    "crates/stele-core",
    "crates/stele-engine",
    "crates/stele-config",
    "crates/stele-dict",
    "crates/stele-schemes",
    "crates/stele-cli",
    "crates/stele-bench",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
# 由 rust-toolchain.toml 固定为 1.98；MSRV 取一个我们真正验证过的下限。
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/stele-ime"
authors = ["Stele-IME contributors"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# 少数 pedantic 项是纯风格，且"改"只会让代码更难读。**逐条列出**，
# 而不是关掉整个 pedantic——关掉整组等于放弃了那几百条有用的检查。
too_many_lines = "allow"          # CLI 的参数分派与自检函数，拆开反而更难跟


[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
